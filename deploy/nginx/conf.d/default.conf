# ============================================================
# 迈科咖啡 · Nginx HTTPS 站点
# 域名：api.mk-coffee.cn / api.mk-coffee.com
# ============================================================

# ---- 限流区（DDoS / 暴力破解防护） ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---- HTTP → HTTPS 重定向 ----
server {
    listen 80;
    server_name api.mk-coffee.cn api.mk-coffee.com;
    server_tokens off;

    # Let's Encrypt ACME 验证（证书续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    server_name api.mk-coffee.cn api.mk-coffee.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ======== 安全头 ========
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ======== 请求限制 ========
    client_max_body_size 5M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # ======== 全局连接限制 ========
    limit_conn conn_limit 20;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ======== API 代理 ========
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        # 隐藏后端信息
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header X-Frame-Options;

        # 缓冲控制
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ======== 登录接口特殊限流 ========
    location /api/auth/wx-login/ {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
