# ============================================================
# 迈科咖啡 · Nginx HTTPS 站点
# 域名：api.mk-coffee.com
# ============================================================

# ---- HTTP → HTTPS 重定向 ----
server {
    listen 80;
    server_name api.mk-coffee.com;

    # Let's Encrypt ACME 验证（证书续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    server_name api.mk-coffee.com;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 10M;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }
}
