# ============================================================
# 迈科咖啡 · 官网落地页（HTTPS，当前生产配置）
# 域名：mk-coffee.cn / www.mk-coffee.cn
# ============================================================
# 依赖证书：/etc/letsencrypt/live/api.mk-coffee.com/
#   SAN = api.mk-coffee.cn, mk-coffee.cn, www.mk-coffee.cn
#   签发/扩展命令见 DEPLOY.md →「官网落地页」一节
#
# ⚠️ 全新部署（证书尚未签发）时，本文件会让 nginx 启动失败。
#    请先用 mk-coffee.cn-http.conf.example 顶替，签好证书再换回。
# ============================================================

# ---- HTTP：ACME 验证 + 全量跳转 HTTPS ----
server {
    listen 80;
    server_name mk-coffee.cn www.mk-coffee.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mk-coffee.cn$request_uri;
    }
}

# ---- HTTPS：www → 裸域 ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.mk-coffee.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    return 301 https://mk-coffee.cn$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name mk-coffee.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ======== 安全头 ========
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
