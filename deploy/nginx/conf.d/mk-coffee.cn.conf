# ============================================================
# 迈科咖啡 · 官网落地页（阶段一：仅 HTTP）
# 域名：mk-coffee.cn / www.mk-coffee.cn
# ============================================================
# 背景：公安联网备案「新办网站」驳回原因之一是「网站域名无法打开」，
#       裸域与 www 此前既无 DNS 解析、nginx 也没有对应站点。
#
# 部署顺序：
#   1. DNSPod 加 A 记录：@ → 124.220.108.118，www → 124.220.108.118
#   2. 本文件已是 HTTP 可用状态，docker compose up -d --force-recreate nginx
#   3. 验证 http://mk-coffee.cn 可打开
#   4. 立即签发 TLS 证书（见 DEPLOY.md「官网落地页」一节）
#   5. 证书就绪后：cp mk-coffee.cn-ssl.conf.example mk-coffee.cn.conf 并重启 nginx
# ============================================================

# ---- www → 裸域（备案填报的访问地址是裸域，统一收敛）----
server {
    listen 80;
    server_name www.mk-coffee.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 http://mk-coffee.cn$request_uri;
    }
}

# ---- 主站：静态落地页 ----
server {
    listen 80;
    server_name mk-coffee.cn;
    server_tokens off;

    # Let's Encrypt ACME 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
