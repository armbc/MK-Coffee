# ============================================================
# 迈科咖啡 · 官网（HTTPS，当前生产配置）
# 域名：mk-coffee.cn / www.mk-coffee.cn
# 后端：systemd 服务 mkweb（Node + Hono），监听 172.17.0.1:3100
# 更新：2026-11-10 由静态备案落地页切换为品牌官网
# ============================================================
# 依赖证书：/etc/letsencrypt/live/api.mk-coffee.com/
#   SAN = api.mk-coffee.cn, mk-coffee.cn, www.mk-coffee.cn
#   签发/扩展命令见 DEPLOY.md →「官网」一节
#
# ⚠️ 全新部署（证书尚未签发）时，本文件会让 nginx 启动失败。
#    请先用 mk-coffee.cn-http.conf.example 顶替，签好证书再换回。
# ============================================================

# ---- HTTP：ACME 验证 + 全量跳转 HTTPS ----
server {
    listen 80;
    server_name mk-coffee.cn www.mk-coffee.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mk-coffee.cn$request_uri;
    }
}

# ---- HTTPS：www → 裸域 ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.mk-coffee.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    return 301 https://mk-coffee.cn$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name mk-coffee.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.mk-coffee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mk-coffee.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ======== 安全头 ========
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME 续期验证（webroot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 压缩（上游 Hono 不压缩；text/javascript 是 .js 的实际 MIME）
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # 留言表单体积很小，2m 足够
    client_max_body_size 2m;

    # 带内容哈希的构建产物：一年长缓存
    location /assets/ {
        proxy_pass http://172.17.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 图片与备案图标：30 天缓存
    location ~ ^/(img/|beian\.png$) {
        proxy_pass http://172.17.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 应用（Node/Hono）：页面 + tRPC API
    location / {
        proxy_pass http://172.17.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
