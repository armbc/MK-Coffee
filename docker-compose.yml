# ============================================================
# 迈科咖啡 · Docker Compose 编排
# 启动：   docker compose up -d
# 查看：   docker compose logs -f
# 停止：   docker compose down
# ============================================================

services:
  # ---- MySQL 8.0 ----
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-mkcoffee_root}"
      MYSQL_DATABASE: ${DB_NAME:-mkcoffee}
      MYSQL_USER: ${DB_USER:-mkcoffee}
      MYSQL_PASSWORD: "${DB_PASSWORD:-mkcoffee}"
    volumes:
      - mysql_data:/var/lib/mysql
    # 避免与宿主机已运行的 MySQL 3306 冲突；容器间通信不需要暴露端口
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Django + Gunicorn ----
  backend:
    build: .
    env_file:
      - backend/.env
    # 生产环境强制使用 production 配置，避免 dev 配置被意外加载
    environment:
      - DJANGO_ENV=production
      - DB_HOST=db
      - DB_SOCKET=
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # 微信支付商户私钥目录（WXPAY_PRIVATE_KEY 传路径时读取；文件不入 git）
      - ./backend/wxpay:/app/wxpay:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  static_volume:
  media_volume:
  certbot_www:
  certbot_conf:
